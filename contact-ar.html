<main>
<h1 class="section-title">اتصل بنا</h1>

<div class="contact-grid">

    <div class="contact-info">
        <p><strong>البريد الإلكتروني:</strong> info@almuasisuh-agri.com</p>
        <p><strong>الهاتف:</strong> +000 000 0000</p>
        <p><strong>العنوان:</strong> مركز التنمية الزراعية</p>
    </div>

    <!-- نموذج الفورم -->
    <form
      action="https://formspree.io/f/maqqarrn"
      method="POST"
    >
        <label for="email">البريد الإلكتروني:</label>
        <input type="email" name="email" id="email" placeholder="أدخل بريدك الإلكتروني" required>

        <label for="message">نص الرسالة:</label>
        <textarea name="message" id="message" placeholder="اكتب رسالتك هنا" required></textarea>

        <!-- حقول إضافية -->
        <label for="name">الاسم:</label>
        <input type="text" name="name" id="name" placeholder="أدخل اسمك">

        <!-- زر الإرسال -->
        <button type="submit">إرسال الرسالة</button>
    </form>

</div>
</main>

<footer>
