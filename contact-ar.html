<main>
<h1 class="section-title">اتصل بنا</h1>

<div class="contact-grid">

    <div class="contact-info">
        <p><strong>البريد الإلكتروني:</strong> info@almuasisuh-agri.com</p>
        <p><strong>الهاتف:</strong> +000 000 0000</p>
        <p><strong>العنوان:</strong> مركز التنمية الزراعية</p>
    </div>

    <form class="contact-form"
          action="https://formspree.io/f/mwvleqdp"
          method="POST"
          enctype="multipart/form-data">

        <input type="text" name="name" placeholder="الاسم" required>
        <input type="email" name="email" placeholder="البريد الإلكتروني" required>
        <textarea name="message" placeholder="نص الرسالة" required></textarea>

        <!-- رفع ملف -->
        <input type="file" name="attachment">

        <button type="submit">إرسال الرسالة</button>
    </form>

</div>
</main>
