<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact Us</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>

<body dir="ltr">

<header>
    <div class="logo">
        <img src="images/logo.png">
        <span>Almuasisuh Alqawmih<br>for Agricultural Development</span>
    </div>

    <nav class="navbar">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <div class="language-switcher">
        <a href="contact.html">EN</a>
        <a href="contact-ar.html">AR</a>
    </div>
</header>

<main>
<h1 class="section-title">Contact Us</h1>

<div class="contact-grid">

    <div class="contact-info">
        <p><strong>Email:</strong> info@almuasisuh-agri.com</p>
        <p><strong>Phone:</strong> +000 000 0000</p>
        <p><strong>Address:</strong> Agricultural Development Center</p>
    </div>

    <form class="contact-form"
          action="https://formspree.io/f/YOUR_FORM_ID"
          method="POST"
          enctype="multipart/form-data">

        <input type="text" name="name" placeholder="Your Name" required>
        <input type="email" name="email" placeholder="Your Email" required>
        <textarea name="message" placeholder="Your Message" required></textarea>

        <!-- File Upload -->
        <input type="file" name="attachment">

        <button type="submit">Send Message</button>
    </form>

</div>
</main>

<footer>
© 2026 Almuasisuh Alqawmih for Agricultural Development
</footer>

</body>
</html>
